<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>React Channel WA</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070b16;--card:#0f1730;--line:#1f2c57;--text:#eaf0ff;--muted:#8a99c7;--blue:#2563ff;--blue2:#5b8cff;--ok:#22c55e}
@media (prefers-color-scheme:light){:root{--bg:#eef3ff;--card:#fff;--line:#cfdaf8;--text:#0e1a3d;--muted:#52618f}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(37,99,255,.35),transparent),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;font-size:20px}
.badge{margin-left:auto;font-size:12px;border-radius:99px;padding:3px 10px;border:1px solid var(--muted);color:var(--muted)}
.badge.on{color:var(--ok);border-color:var(--ok)}
h1{font-size:26px;line-height:1.25;margin:0 0 8px}
p.sub{color:var(--muted);margin:0 0 20px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(37,99,255,.15);margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 4px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--blue)}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.err{color:#f87171}.okc{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:6px 10px;font-size:18px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue)}
.code{margin-top:14px;text-align:center;font-size:30px;font-weight:800;letter-spacing:4px;padding:14px;border-radius:14px;background:rgba(37,99,255,.14);border:1px dashed var(--blue);font-family:ui-monospace,Menlo,monospace}
.preview{margin-top:16px;padding:12px;border-radius:12px;background:rgba(37,99,255,.12);border:1px dashed var(--blue);font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;line-height:1.7}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2))}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lock{opacity:.5;pointer-events:none}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement;
const { useState, useEffect, useMemo } = React;
const EMOJIS = ["❤️","💗","💕","💜","😂","🔥","👍","😍","🙏","😮"];
// GANTI dengan alamat backend Render kamu, tanpa garis miring di akhir
const API_BASE = "https://GANTI-INI.onrender.com";
const api = async (path, body) => {
  const r = await fetch(API_BASE + "/api/" + path, {
    method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body)
  });
  const t = await r.text();
  let d;
  try { d = JSON.parse(t); }
  catch(e){ throw new Error("Backend tidak ditemukan. Cek API_BASE di rchrapa.html, harus berisi alamat backend Render kamu yang sedang aktif."); }
  if(!r.ok) throw new Error(d.error || "Error");
  return d;
};

function App(){
  const [num,setNum] = useState(()=>{ try{return localStorage.getItem("wa_num")||""}catch(e){return ""} });
  const [code,setCode] = useState("");
  const [connected,setConnected] = useState(false);
  const [link,setLink] = useState("");
  const [picked,setPicked] = useState([]);
  const [custom,setCustom] = useState("");
  const [msg,setMsg] = useState({t:"",ok:true});
  const [busy,setBusy] = useState(false);

  const cleanNum = num.replace(/\D/g,"");
  const numOk = /^[1-9]\d{8,14}$/.test(cleanNum);
  const linkOk = /^https:\/\/whatsapp\.com\/channel\/[A-Za-z0-9]+(\/\d+)?\/?$/.test(link.trim());
  const emojiStr = useMemo(()=>[...picked,...custom.split(/[,\s]+/).filter(Boolean)].join(","),[picked,custom]);
  const tail = `${link.trim()||"<linkch>"}${emojiStr?" "+emojiStr:""}`;

  // Cek status saat nomor tersimpan, dan polling selama menunggu pairing
  useEffect(()=>{
    if(!numOk) return;
    let stop=false;
    const tick = async()=>{
      try{
        const d = await (await fetch(API_BASE+"/api/status?number="+cleanNum)).json();
        if(!stop){ setConnected(d.connected); if(d.connected) setCode(""); }
      }catch(e){}
    };
    tick();
    const id = setInterval(tick, 3000);
    return ()=>{stop=true;clearInterval(id)};
  },[cleanNum,numOk]);

  const pair = async()=>{
    setBusy(true); setMsg({t:"",ok:true});
    try{
      try{localStorage.setItem("wa_num",cleanNum)}catch(e){}
      const d = await api("pair",{number:cleanNum});
      if(d.connected) setConnected(true); else setCode(d.code);
    }catch(e){ setMsg({t:e.message,ok:false}); }
    setBusy(false);
  };
  const send = async()=>{
    setBusy(true); setMsg({t:"",ok:true});
    try{
      await api("react",{number:cleanNum,link:link.trim(),emojis:emojiStr});
      setMsg({t:"✅ Format .react dan .react2 terkirim ke chat kamu",ok:true});
    }catch(e){ setMsg({t:e.message,ok:false}); }
    setBusy(false);
  };
  const logout = async()=>{ await api("logout",{number:cleanNum}); setConnected(false); setCode(""); };
  const toggle = e => setPicked(p=>p.includes(e)?p.filter(x=>x!==e):[...p,e]);

  return h("div",{className:"wrap"},
    h("div",{className:"brand"},h("div",{className:"logo"},"⚡"),"React Channel",
      h("span",{className:"badge"+(connected?" on":"")},connected?"🟢 Terhubung":"⚪ Belum terhubung")),
    h("h1",null,"React Channel WhatsApp Sekali Klik"),
    h("p",{className:"sub"},"Hubungkan nomor sekali pakai kode pairing, lalu kirim format .react dan .react2 sekaligus."),

    h("div",{className:"card"},
      h("h2",null,"1. Hubungkan Perangkat"),
      h("label",null,"Nomor WhatsApp"),
      h("input",{value:num,disabled:connected,onChange:e=>setNum(e.target.value),placeholder:"628xxxxxxxxxx",inputMode:"tel"}),
      h("div",{className:"hint "+(num&&!numOk?"err":"")},num&&!numOk?"Pakai kode negara tanpa + / 0":"Kode negara, tanpa + atau 0 di depan"),
      connected
        ? h("button",{className:"btn alt",onClick:logout},"Putuskan Perangkat")
        : h("button",{className:"btn",disabled:!numOk||busy,onClick:pair},busy?"Memproses...":"🔗 Dapatkan Kode Pairing"),
      code && h("div",null,
        h("div",{className:"code"},code),
        h("div",{className:"hint"},"Buka WhatsApp → Perangkat Tertaut → Tautkan Perangkat → Tautkan dengan nomor telepon, lalu masukkan kode di atas. Halaman ini otomatis aktif setelah berhasil."))
    ),

    h("div",{className:"card"+(connected?"":" lock")},
      h("h2",null,"2. React Channel"+(connected?"":" (aktif setelah terhubung)")),
      h("label",null,"Link Post Channel"),
      h("input",{value:link,onChange:e=>setLink(e.target.value),placeholder:"https://whatsapp.com/channel/xxxx/123"}),
      h("div",{className:"hint "+(link&&!linkOk?"err":"")},link&&!linkOk?"Link channel tidak valid":"Salin link dari post channel"),
      h("label",null,"Emoji (boleh kosong)"),
      h("div",{className:"row"},EMOJIS.map(e=>h("button",{key:e,className:"chip"+(picked.includes(e)?" on":""),onClick:()=>toggle(e)},e))),
      h("input",{style:{marginTop:8},value:custom,onChange:e=>setCustom(e.target.value),placeholder:"Emoji lain, pisahkan koma"}),
      h("div",{className:"preview"},h("div",null,".react "+tail),h("div",null,".react2 "+tail)),
      h("button",{className:"btn",disabled:!connected||!linkOk||busy,onClick:send},busy?"Mengirim...":"🚀 Kirim .react + .react2")
    ),
    msg.t && h("div",{className:"hint "+(msg.ok?"okc":"err"),style:{textAlign:"center"}},msg.t),
    h("div",{className:"foot"},"© 2026 — Dibuat dengan React ⚡")
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
